version: 2
updates:
  # Dependencies are pinned exactly, so every update is a pull request that CI has to prove.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    versioning-strategy: increase
    groups:
      dev-tooling:
        patterns: ['eslint*', '@eslint/*', 'typescript*', 'prettier', 'stylelint*', 'markdownlint*', 'vite', 'vitest', '@vitest/*', '@playwright/*', '@types/*']
    ignore:
      # typescript-eslint 8.x declares `typescript >=4.8.4 <6.1.0`: TypeScript 7 would take the
      # type-aware lint with it. Revisit when typescript-eslint supports it.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      # The runtime here and in CI is Node 24; types for a newer runtime describe APIs that do not
      # exist in it. Bump this together with the Node version in the workflows.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    commit-message:
      prefix: 'build(deps)'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: 'build(ci)'
