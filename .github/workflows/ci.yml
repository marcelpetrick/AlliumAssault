name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reuse:
    name: REUSE / SPDX compliance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: fsfe/reuse-action@v6

  actionlint:
    name: Workflow lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: raven-actions/actionlint@v2

  verify:
    name: Lint, test, build, E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # Coverage, not just the tests: this is where the enforced thresholds are checked.
      - run: npm run coverage
      - run: npm run build

      - name: Install Google Chrome for Playwright
        run: npx playwright install --with-deps chrome

      - run: npm run e2e

      - name: Upload Playwright results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results
          path: test-results
          retention-days: 7
