name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run coverage
      - run: npm run build

      # The browser suite is the only gate that sees the renderer actually run; a release must not
      # ship a build it has not passed.
      - name: Install Google Chrome for Playwright
        run: npx playwright install --with-deps chrome
      - run: npm run e2e

      - name: Check tag matches package.json
        run: test "${GITHUB_REF_NAME#v}" = "$(node -p "require('./package.json').version")"

      - name: Package static build
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          (cd dist && zip -qr "../allium-assault-${VERSION}-web.zip" .)
          sha256sum "allium-assault-${VERSION}-web.zip" > "allium-assault-${VERSION}-web.zip.sha256"

      - name: Extract release notes from CHANGELOG.md
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v v="[${VERSION}]" '/^## \[/ { p = index($0, v) > 0; next } p' CHANGELOG.md > notes.md
          # The backticks are Markdown for the release notes, not a command substitution.
          # shellcheck disable=SC2016
          printf '\n---\nServe the unzipped folder with any static web server (for example `npx serve`) and open it in a modern browser.\n' >> notes.md

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" allium-assault-*-web.zip* \
            --title "Allium Assault ${GITHUB_REF_NAME}" \
            --notes-file notes.md \
            --verify-tag
